spring.application.name=NauJava
server.port=8080

# Конфигурация приложения
app.name=Log Analyzer
app.version=1.0.0
app.demo-data.enabled=true

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/log_analyzer
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- Spring Data REST (лаба 5) ---
spring.data.rest.base-path=/api
spring.data.rest.detection-strategy=annotated
spring.data.rest.default-page-size=20

# --- Swagger UI / OpenAPI (лаба 5) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# --- Actuator ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${app.name}
info.app.version=${app.version}
info.app.description=Log and event journal analysis

# --- Пользователи стенда (лаба 6) ---
app.security.admin.username=admin
app.security.admin.password=admin123
app.security.user.username=user
app.security.user.password=user123

springdoc.paths-to-match=/custom/**