spring.application.name=NauJava
server.port=8080

# Конфигурация приложения (лаба 3)
app.name=Log Analyzer
app.version=1.0.0
# Загрузка демонстрационных данных при старте (если БД пустая)
app.demo-data.enabled=true

# --- Подключение к PostgreSQL (лаба 4) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/log_analyzer
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- Мониторинг Actuator ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${app.name}
info.app.version=${app.version}
info.app.description=Log and event journal analysisp.description=Log and event journal analysis