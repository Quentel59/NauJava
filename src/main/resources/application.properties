spring.application.name=NauJava
server.port=8080

# Конфигурация приложения (п. 3.7)
app.name=Log Analyzer
app.version=1.0.0
app.console.enabled=true

# Мониторинг Spring Boot Actuator (п. 3.7 - мониторинг)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${app.name}
info.app.version=${app.version}
info.app.description=Log and event journal analysis