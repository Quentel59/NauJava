<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход — Log Analyzer</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; margin: 60px auto; max-width: 420px; color: #222; }
        h1 { font-size: 22px; }
        form { background: #f7f7f7; border: 1px solid #ddd; padding: 18px; }
        label { display: block; margin-bottom: 10px; font-size: 14px; }
        input[type=text], input[type=password] { width: 100%; padding: 6px; box-sizing: border-box; }
        button { padding: 8px 16px; }
        .msg { padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; font-size: 14px; }
        .err { background: #fdecea; border-color: #e0b4b0; }
        .ok { background: #eaf7ea; border-color: #b6d8b6; }
    </style>
</head>
<body>

<h1>Log Analyzer — вход в систему</h1>

<div class="msg err" th:if="${param.error}">Неверный логин или пароль</div>
<div class="msg ok" th:if="${param.logout}">Вы вышли из системы</div>
<div class="msg ok" th:if="${param.registered}">Регистрация выполнена, войдите в систему</div>

<form th:action="@{/login}" method="post">
    <label>Логин:
        <input type="text" name="username" autofocus required>
    </label>
    <label>Пароль:
        <input type="password" name="password" required>
    </label>
    <button type="submit">Войти</button>
</form>

<p>Нет аккаунта? <a th:href="@{/registration}">Зарегистрироваться</a></p>

</body>
</html>
